<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Места для учёбы</title>

<!-- ============================================================
     ЯНДЕКС.КАРТЫ

     Как получить ключ (бесплатно, без карты):
     1. Зайди на https://developer.tech.yandex.ru/
     2. Войди через аккаунт Яндекс (или зарегистрируй)
     3. "Подключить API" → выбери "JavaScript API и HTTP Геокодер"
     4. Заполни короткую форму (название проекта, сайт можно указать любой)
     5. Скопируй выданный ключ и вставь вместо YOUR_API_KEY ниже
     ============================================================ -->
<script src="https://api-maps.yandex.ru/2.1/?apikey=1dc32d75-7926-4a47-81b6-5fd9f5d4fa08&lang=ru_RU" type="text/javascript"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     1. ТОКЕНЫ ДИЗАЙНА — меняй здесь, если хочешь другую палитру
     ============================================================ */
  :root{
    --ink:#1E2A25;          /* основной текст, тёмно-зелёный почти чёрный */
    --ink-soft:#4B5A53;     /* вторичный текст */
    --paper:#F4F1E8;        /* фон страницы, тёплый бумажный */
    --paper-card:#FFFFFF;   /* фон карточек */
    --sage:#5B7A63;         /* приглушённый зелёный акцент */
    --sage-deep:#324237;    /* тёмно-зелёный для активных элементов */
    --gold:#B8863B;         /* тёплый акцент для меток/бейджей */
    --line:#DCD6C4;         /* линии/бордеры */
    --line-strong:#B9B29A;

    --font-display: 'Fraunces', Georgia, serif;
    --font-ui: 'Inter', system-ui, sans-serif;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-ui);
    line-height:1.5;
  }

  /* ============================================================
     2. ШАПКА
     ============================================================ */
  header{
    padding:2.5rem 1.5rem 1.5rem;
    max-width:1100px;
    margin:0 auto;
  }
  header .eyebrow{
    font-family:var(--font-ui);
    font-size:0.8rem;
    color:var(--sage);
    font-weight:600;
    letter-spacing:0.02em;
    margin:0 0 0.4rem;
  }
  header h1{
    font-family:var(--font-display);
    font-weight:500;
    font-size:2.4rem;
    margin:0 0 0.5rem;
    color:var(--sage-deep);
  }
  header p.sub{
    color:var(--ink-soft);
    max-width:520px;
    margin:0;
    font-size:1rem;
  }

  /* ============================================================
     3. ПАНЕЛЬ ФИЛЬТРОВ
     ============================================================ */
  .filters{
    max-width:1100px;
    margin:0 auto;
    padding:0 1.5rem 1.5rem;
    display:flex;
    flex-wrap:wrap;
    gap:0.6rem;
  }
  .filter-btn{
    font-family:var(--font-ui);
    font-size:0.85rem;
    padding:0.5rem 1rem;
    border-radius:100px;
    border:1px solid var(--line-strong);
    background:var(--paper-card);
    color:var(--ink-soft);
    cursor:pointer;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .filter-btn:hover{ border-color:var(--sage); }
  .filter-btn.active{
    background:var(--sage-deep);
    border-color:var(--sage-deep);
    color:#fff;
  }

  .search-box{
    max-width:1100px;
    margin:0 auto;
    padding:0 1.5rem 1.5rem;
  }
  .search-box input{
    width:100%;
    max-width:360px;
    padding:0.65rem 1rem;
    border-radius:8px;
    border:1px solid var(--line-strong);
    font-family:var(--font-ui);
    font-size:0.95rem;
    background:var(--paper-card);
    color:var(--ink);
  }
  .search-box input:focus{ outline:2px solid var(--sage); outline-offset:1px; }

  /* ============================================================
     4. ОСНОВНАЯ ОБЛАСТЬ: КАРТА + СПИСОК
     ============================================================ */
  .layout{
    max-width:1100px;
    margin:0 auto;
    padding:0 1.5rem 3rem;
    display:grid;
    grid-template-columns:1fr;
    gap:1.5rem;
  }
  @media(min-width:860px){
    .layout{ grid-template-columns: 1fr 1fr; align-items:start; }
    #map{ position:sticky; top:1.5rem; }
  }

  #map{
    height:420px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#eae6d8;
  }

  .card-list{
    display:flex;
    flex-direction:column;
    gap:0.9rem;
  }
  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:1.1rem 1.25rem;
    cursor:pointer;
    transition:border-color 0.15s;
  }
  .card:hover, .card.highlighted{ border-color:var(--sage); }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:0.75rem;
  }
  .card h3{
    font-family:var(--font-display);
    font-weight:500;
    font-size:1.15rem;
    margin:0 0 0.2rem;
    color:var(--sage-deep);
  }
  .card .type-badge{
    font-size:0.72rem;
    font-weight:600;
    color:var(--gold);
    background:#F6EBD8;
    padding:0.2rem 0.55rem;
    border-radius:100px;
    white-space:nowrap;
  }
  .card .address{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0.3rem 0 0.6rem;
  }
  .card .desc{
    font-size:0.9rem;
    color:var(--ink);
    margin:0 0 0.6rem;
  }
  .card .tags{
    display:flex;
    flex-wrap:wrap;
    gap:0.4rem;
  }
  .card .tag{
    font-size:0.75rem;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:0.15rem 0.5rem;
    border-radius:100px;
  }

  .empty-state{
    text-align:center;
    padding:2.5rem 1rem;
    color:var(--ink-soft);
    font-size:0.95rem;
  }

  footer{
    max-width:1100px;
    margin:0 auto;
    padding:0 1.5rem 2.5rem;
    color:var(--ink-soft);
    font-size:0.8rem;
    border-top:1px solid var(--line);
    padding-top:1.2rem;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Карта учебных мест</p>
  <h1>Где учиться</h1>
  <p class="sub">Библиотеки, книжные клубы и тихие места для занятий рядом с тобой — с описанием, фото и удобствами каждой точки.</p>
</header>

<div class="filters" id="filters"></div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Поиск по названию или району…" />
</div>

<div class="layout">
  <div id="map"></div>
  <div class="card-list" id="cardList"></div>
</div>

<footer>
  Проект «Карта учебных мест» · данные обновляются вручную · сделано в рамках индивидуального проекта
</footer>

<script>
/* ================================================================
   5. ДАННЫЕ — ГЛАВНОЕ МЕСТО, КУДА ТЫ БУДЕШЬ ВСЁ ДОБАВЛЯТЬ
   ================================================================
   Каждая точка — один объект в этом массиве.
   Просто скопируй блок { ... }, поменяй значения и добавь запятую.

   ВАЖНО про координаты (lat, lng):
   - Найди место в Google Maps или Яндекс.Картах
   - Нажми правой кнопкой на точку на карте → "Что здесь?"
     или посмотри в адресной строке — там будут два числа
   - Первое число — lat (широта), второе — lng (долгота)
================================================================ */

const places = [
  {
    id: 1,
    name: "Центральная городская библиотека",
    type: "library",       // library | bookclub | cafe | coworking
    address: "ул. Примерная, 12",
    lat: 55.751244,
    lng: 37.618423,
    description: "Просторные читальные залы, бесплатный wi-fi, много розеток.",
    tags: ["Wi-Fi", "Розетки", "Тихо", "Бесплатно"]
  },
  {
    id: 2,
    name: "Книжный клуб «Страница»",
    type: "bookclub",
    address: "пр. Книжников, 5",
    lat: 55.755814,
    lng: 37.617635,
    description: "Встречи по четвергам, можно готовиться к обсуждениям в будни днём.",
    tags: ["Можно говорить", "Кофе", "По записи"]
  },
  {
    id: 3,
    name: "Антикафе «Полка»",
    type: "cafe",
    address: "ул. Читателей, 8",
    lat: 55.748489,
    lng: 37.625198,
    description: "Оплата по времени, включены чай и печенье, открыто допоздна.",
    tags: ["Wi-Fi", "Розетки", "До 23:00"]
  }
];

/* Подписи и цвета типов — меняй, если добавишь новый тип */
const typeLabels = {
  library: "Библиотека",
  bookclub: "Книжный клуб",
  cafe: "Антикафе",
  coworking: "Коворкинг"
};

/* ================================================================
   6. ЛОГИКА САЙТА — трогать не обязательно
   ================================================================ */

let activeType = "all";
let markers = {};
let map; // создастся, когда Яндекс.Карты будут готовы

// --- Карта ---
// Запускаем карту только если API Яндекс.Карт успешно загрузился.
// Если API недоступен или ключ ограничен, остальная часть сайта продолжит работать.
if (typeof ymaps !== 'undefined') {
  ymaps.ready(initMap);
} else {
  const mapEl = document.getElementById('map');
  if (mapEl) {
    mapEl.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;color:#4B5A53">Карта временно недоступна, но список мест работает.</div>';
  }
}

function initMap(){
  map = new ymaps.Map('map', {
    center: [places[0]?.lat || 55.75, places[0]?.lng || 37.61],
    zoom: 12,
    controls: ['zoomControl'] // список кнопок управления картой
  });
  update(); // отрисовываем точки, как только карта готова
}

function renderMarkers(list){
  if(!map) return; // карта ещё не загрузилась — выходим
  Object.values(markers).forEach(m => map.geoObjects.remove(m));
  markers = {};
  list.forEach(p => {
    const placemark = new ymaps.Placemark(
      [p.lat, p.lng],
      {
        balloonContentHeader: p.name,
        balloonContentBody: p.address
      },
      {
        preset: 'islands#greenDotIcon' // готовая зелёная метка из набора Яндекса
      }
    );
    placemark.events.add('click', () => highlightCard(p.id));
    map.geoObjects.add(placemark);
    markers[p.id] = placemark;
  });
}

// --- Фильтры ---
const filterTypes = ["all", ...Object.keys(typeLabels)];
const filtersEl = document.getElementById('filters');
filterTypes.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (t === 'all' ? ' active' : '');
  btn.textContent = t === 'all' ? 'Все места' : typeLabels[t];
  btn.dataset.type = t;
  btn.addEventListener('click', () => {
    activeType = t;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    update();
  });
  filtersEl.appendChild(btn);
});

// --- Поиск ---
document.getElementById('searchInput').addEventListener('input', update);

// --- Список карточек ---
const cardListEl = document.getElementById('cardList');

function getFiltered(){
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  return places.filter(p => {
    const typeMatch = activeType === 'all' || p.type === activeType;
    const searchMatch = !query ||
      p.name.toLowerCase().includes(query) ||
      p.address.toLowerCase().includes(query);
    return typeMatch && searchMatch;
  });
}

function renderCards(list){
  cardListEl.innerHTML = '';
  if(list.length === 0){
    cardListEl.innerHTML = '<div class="empty-state">Ничего не найдено. Попробуй другой запрос или фильтр.</div>';
    return;
  }
  list.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + p.id;
    card.innerHTML = `
      <div class="card-top">
        <h3>${p.name}</h3>
        <span class="type-badge">${typeLabels[p.type] || p.type}</span>
      </div>
      <p class="address">${p.address}</p>
      <p class="desc">${p.description}</p>
      <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    `;
    card.addEventListener('click', () => {
      if(!map) return;
      map.setCenter([p.lat, p.lng], 15);
      markers[p.id].balloon.open();
      highlightCard(p.id);
    });
    cardListEl.appendChild(card);
  });
}

function highlightCard(id){
  document.querySelectorAll('.card').forEach(c => c.classList.remove('highlighted'));
  const el = document.getElementById('card-' + id);
  if(el){
    el.classList.add('highlighted');
    el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

function update(){
  const filtered = getFiltered();
  renderCards(filtered);
  renderMarkers(filtered);
}

// Карточки можно показать сразу, не дожидаясь карты
renderCards(getFiltered());
</script>

</body>
</html>
