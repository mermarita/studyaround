<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyAround</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://api-maps.yandex.ru/2.1/?apikey=1dc32d75-7926-4a47-81b6-5fd9f5d4fa08&lang=ru_RU"></script>

  <style>
    :root{
      --bg:#FBF8EF;
      --text:#242846;
      --accent:#B13E5A;
      --pill:#E6E6E4;
      --pill-active:#D8D9DD;
      --card:#F0EFEB;
      --muted:#66697B;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"PT Serif",Georgia,"Times New Roman",serif;
    }

    .page{
      width:min(100%,430px);
      margin:0 auto;
      padding:46px 20px 36px;
    }

    h1{
      font-family:Georgia,"Times New Roman",serif;
      margin:0;
      font-size:42px;
      line-height:.95;
      font-weight:700;
      letter-spacing:-1.5px;
    }

    h1 span{color:var(--accent)}

    .intro{
      margin:18px 0 20px;
      max-width:355px;
      font-size:15px;
      line-height:1.28;
    }

    .filters{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
      margin-bottom:40px;
    }

    .filter-btn{
      border:0;
      min-height:26px;
      padding:6px 7px;
      border-radius:6px;
      background:var(--pill);
      color:var(--text);
      font:700 11px/1.1 "PT Serif",Georgia,"Times New Roman",serif;
      cursor:pointer;
      transition:.15s ease;
    }

    .filter-btn.active{
      background:var(--pill-active);
      box-shadow:inset 0 0 0 1px rgba(36,40,70,.08);
    }

    #map{
      width:100%;
      height:333px;
      margin-bottom:50px;
      background:#D9D9D9;
      overflow:hidden;
    }

    .places{
      display:flex;
      flex-direction:column;
      gap:23px;
    }

    .place-card{
      width:100%;
      padding:16px 18px;
      border:0;
      border-radius:6px;
      background:var(--card);
      color:var(--text);
      text-align:left;
      font-family:"PT Serif",Georgia,"Times New Roman",serif;
      cursor:pointer;
    }

    .place-card h2{
      margin:0 0 5px;
      font-size:17px;
      line-height:1.15;
    }

    .address{
      margin:0 0 7px;
      color:var(--accent);
      font-size:12.5px;
      line-height:1.25;
    }

    .description{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.3;
    }

    .empty{
      padding:18px;
      border-radius:6px;
      background:var(--card);
      color:var(--muted);
      font-size:14px;
    }

    @media(min-width:760px){
      .page{
        width:min(100%,980px);
        padding-top:60px;
      }

      h1{font-size:56px}

      .intro{
        max-width:520px;
        font-size:17px;
      }

      .filters{width:520px}
      #map{height:430px}

      .places{
        display:grid;
        grid-template-columns:repeat(2,1fr);
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1>Study<span>Around</span></h1>

    <p class="intro">
      Библиотеки, кафе и тихие места для занятий рядом с тобой — с описанием, фото и удобствами каждой точки.
    </p>

    <div class="filters">
      <button class="filter-btn active" data-type="all">Все</button>
      <button class="filter-btn" data-type="cafe">Кафе</button>
      <button class="filter-btn" data-type="library">Библиотеки</button>
      <button class="filter-btn" data-type="coworking">Коворкинг</button>
    </div>

    <div id="map"></div>
    <section class="places" id="places"></section>
  </main>

  <script>
    const places=[
      {
        id:1,
        name:"Центральная городская библиотека",
        type:"library",
        address:"ул. Примерная, 12",
        lat:55.751244,
        lng:37.618423,
        description:"Просторные читальные залы, бесплатный Wi-Fi, много розеток."
      },
      {
        id:2,
        name:"Кафе «Страница»",
        type:"cafe",
        address:"пр. Книжников, 5",
        lat:55.755814,
        lng:37.617635,
        description:"Спокойное место для работы и учёбы, есть кофе и розетки."
      },
      {
        id:3,
        name:"Surf Coffee x Cave",
        type:"cafe",
        address:"ул. Новокузнецкая, 6",
        lat:55.738404,
        lng:37.629789,
        description:"Три зала, есть коворкинг-зона, бесплатный Wi-Fi."
      },
      {
        id:4,
        name:"Библиотека №19 имени Ф.М. Достоевского",
        type:"library",
        address:"Чистопрудный бульвар, 25",
        lat:55.760150,
        lng:37.646830,,
        description:"Тихое и спокойное место, вход бесплатный, есть розетки."
       }
    ];

    let map;
    let activeType="all";
    const markers={};
    const placesEl=document.getElementById("places");

    function getPlaces(){
      return activeType==="all" ? places : places.filter(place=>place.type===activeType);
    }

    function renderCards(){
      const list=getPlaces();

      if(!list.length){
        placesEl.innerHTML='<div class="empty">В этой категории пока нет мест.</div>';
        return;
      }

      placesEl.innerHTML=list.map(place=>`
        <button class="place-card" data-id="${place.id}">
          <h2>${place.name}</h2>
          <p class="address">${place.address}</p>
          <p class="description">${place.description}</p>
        </button>
      `).join("");

      document.querySelectorAll(".place-card").forEach(card=>{
        card.addEventListener("click",()=>{
          const place=places.find(p=>p.id===Number(card.dataset.id));
          if(!map || !place) return;
          map.setCenter([place.lat,place.lng],15,{duration:250});
          markers[place.id]?.balloon.open();
        });
      });
    }

    function renderMarkers(){
      if(!map) return;
      map.geoObjects.removeAll();

      getPlaces().forEach(place=>{
        const marker=new ymaps.Placemark(
          [place.lat,place.lng],
          {
            balloonContentHeader:place.name,
            balloonContentBody:`${place.address}<br>${place.description}`
          },
          {preset:"islands#redDotIcon"}
        );

        markers[place.id]=marker;
        map.geoObjects.add(marker);
      });
    }

    function update(){
      renderCards();
      renderMarkers();
    }

    document.querySelectorAll(".filter-btn").forEach(button=>{
      button.addEventListener("click",()=>{
        activeType=button.dataset.type;
        document.querySelectorAll(".filter-btn").forEach(btn=>btn.classList.remove("active"));
        button.classList.add("active");
        update();
      });
    });

    renderCards();

    if(window.ymaps){
      ymaps.ready(()=>{
        map=new ymaps.Map("map",{
          center:[55.751244,37.618423],
          zoom:12,
          controls:["zoomControl"]
        });
        renderMarkers();
      });
    }
  </script>
</body>
</html>
